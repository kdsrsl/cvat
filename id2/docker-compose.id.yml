name: iat3

x-backend-env: &backend-env
  IAT3_POSTGRES_HOST: iat3_db
  IAT3_REDIS_INMEM_HOST: iat3_redis_inmem
  IAT3_REDIS_INMEM_PORT: 6379
  IAT3_REDIS_ONDISK_HOST: iat3_redis_ondisk
  IAT3_REDIS_ONDISK_PORT: 6666
  IAT3_LOG_IMPORT_ERRORS: 'true'
  IAT3_ALLOW_STATIC_CACHE: '${IAT3_ALLOW_STATIC_CACHE:-no}'
  CVAT_POSTGRES_HOST: iat3_db
  CVAT_REDIS_INMEM_HOST: iat3_redis_inmem
  CVAT_REDIS_INMEM_PORT: 6379
  CVAT_REDIS_ONDISK_HOST: iat3_redis_ondisk
  CVAT_REDIS_ONDISK_PORT: 6666
  CVAT_LOG_IMPORT_ERRORS: 'true'
  CVAT_ALLOW_STATIC_CACHE: '${IAT3_ALLOW_STATIC_CACHE:-no}'
  DJANGO_LOG_SERVER_HOST: vector
  DJANGO_LOG_SERVER_PORT: 80
  no_proxy: clickhouse,grafana,vector,nuclio,opa,${no_proxy:-}
  SMOKESCREEN_OPTS: ${SMOKESCREEN_OPTS:-}

x-backend-deps: &backend-deps
  iat3_redis_inmem:
    condition: service_started
  iat3_redis_ondisk:
    condition: service_started
  iat3_db:
    condition: service_started

x-clickhouse-env: &clickhouse-env
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: 8123
  CLICKHOUSE_DB: iat3
  CLICKHOUSE_USER: user
  CLICKHOUSE_PASSWORD: user

services:
  iat3_db:
    container_name: iat3_db
    image: acc286cc12c5
    restart: always
    build:
      context: .
      args:
        - BUILD_DATE=${CURRENT_TIMESTAMP}
    environment:
      POSTGRES_USER: root
      POSTGRES_DB: iat3
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - iat3_db:/var/lib/postgresql/data
    networks:
      - iat3

  iat3_redis_inmem:
    container_name: iat3_redis_inmem
    image: d2d4688fcebe
    restart: always
    command: [
      "redis-server",
      "--save", "60", "100",
      "--appendonly", "yes",
    ]
    volumes:
      - iat3_inmem_db:/data
    networks:
      - iat3

  iat3_redis_ondisk:
    container_name: iat3_redis_ondisk
    image: 373063f3f9d4
    restart: always
    command: [
      "--dir", "/var/lib/kvrocks/data"
    ]
    # The kvrocks image a) has a healthcheck command, and b) has a root process
    # that doesn't reap children, so it's susceptible to the problem described here:
    # <https://stackoverflow.com/a/77109064>. Kvrocks also uses a tiny timeout for
    # its healthcheck command (1s), which makes the problem more likely to manifest.
    # Use a separate init process as a workaround.
    init: true
    volumes:
      - iat3_cache_db:/var/lib/kvrocks/data
    networks:
      - iat3

  iat3_server:
    container_name: iat3_server
    image: 6158f577feaa
    restart: always
    depends_on:
      <<: *backend-deps
      iat3_opa:
        condition:
          service_started
    build:
      context: .
      args:
        - BUILD_DATE=${CURRENT_TIMESTAMP}
    environment:
      <<: [*backend-env, *clickhouse-env]
      DJANGO_MODWSGI_EXTRA_ARGS: ''
      ALLOWED_HOSTS: '*'
      ADAPTIVE_AUTO_ANNOTATION: 'false'
      NUMPROCS: 2
      IAT3_ANALYTICS: 1
      IAT3_BASE_URL:
      ONE_RUNNING_JOB_IN_QUEUE_PER_USER:
    command: init run server
    labels:
      traefik.enable: "true"
      traefik.http.services.iat3.loadbalancer.server.port: "8080"
      traefik.http.routers.iat3.rule:
        Host(`${IAT3_HOST:-localhost}`) &&
        (PathPrefix(`/api/`) || PathPrefix(`/static/`) || PathPrefix(`/admin`)
          || PathPrefix(`/django-rq`))
      traefik.http.routers.iat3.entrypoints: web
    volumes:
      - iat3_data:/home/django/data
      - iat3_keys:/home/django/keys
      - iat3_logs:/home/django/logs
    networks:
      iat3:
        aliases:
          - iat3-server

  iat3_worker_utils:
    container_name: iat3_worker_utils
    image: 6158f577feaa
    restart: always
    depends_on: *backend-deps
    environment:
      <<: *backend-env
      IAT3_REDIS_INMEM_PASSWORD: ''
      NUMPROCS: 1
    command: run worker notifications cleaning
    volumes:
      - iat3_data:/home/django/data
      - iat3_keys:/home/django/keys
      - iat3_logs:/home/django/logs
    networks:
      - iat3

  iat3_worker_import:
    container_name: iat3_worker_import
    image: 6158f577feaa
    restart: always
    depends_on: *backend-deps
    environment:
      <<: *backend-env
      NUMPROCS: 2
    command: run worker import
    volumes:
      - iat3_data:/home/django/data
      - iat3_keys:/home/django/keys
      - iat3_logs:/home/django/logs
    networks:
      - iat3

  iat3_worker_export:
    container_name: iat3_worker_export
    image: 6158f577feaa
    restart: always
    depends_on: *backend-deps
    environment:
      <<: [*backend-env, *clickhouse-env]
      NUMPROCS: 2
    command: run worker export
    volumes:
      - iat3_data:/home/django/data
      - iat3_keys:/home/django/keys
      - iat3_logs:/home/django/logs
    networks:
      - iat3

  iat3_worker_annotation:
    container_name: iat3_worker_annotation
    image: 6158f577feaa
    restart: always
    depends_on: *backend-deps
    environment:
      <<: *backend-env
      NUMPROCS: 1
    command: run worker annotation
    volumes:
      - iat3_data:/home/django/data
      - iat3_keys:/home/django/keys
      - iat3_logs:/home/django/logs
    networks:
      - iat3

  iat3_worker_webhooks:
    container_name: iat3_worker_webhooks
    image: 6158f577feaa
    restart: always
    depends_on: *backend-deps
    environment:
      <<: *backend-env
      NUMPROCS: 1
    command: run worker webhooks
    volumes:
      - iat3_data:/home/django/data
      - iat3_keys:/home/django/keys
      - iat3_logs:/home/django/logs
    networks:
      - iat3

  iat3_worker_quality_reports:
    container_name: iat3_worker_quality_reports
    image: 6158f577feaa
    restart: always
    depends_on: *backend-deps
    environment:
      <<: *backend-env
      NUMPROCS: 1
    command: run worker quality_reports
    volumes:
      - iat3_data:/home/django/data
      - iat3_keys:/home/django/keys
      - iat3_logs:/home/django/logs
    networks:
      - iat3

  iat3_worker_chunks:
    container_name: iat3_worker_chunks
    image: 6158f577feaa
    restart: always
    depends_on: *backend-deps
    environment:
      <<: *backend-env
      NUMPROCS: 2
    command: run worker chunks
    volumes:
      - iat3_data:/home/django/data
      - iat3_keys:/home/django/keys
      - iat3_logs:/home/django/logs
    networks:
      - iat3

  iat3_worker_consensus:
    container_name: iat3_worker_consensus
    image: 6158f577feaa
    restart: always
    depends_on: *backend-deps
    environment:
      <<: *backend-env
      NUMPROCS: 1
    command: run worker consensus
    volumes:
      - iat3_data:/home/django/data
      - iat3_keys:/home/django/keys
      - iat3_logs:/home/django/logs
    networks:
      - iat3

  iat3_ui:
    container_name: iat3_ui
    image: fe21af2e6431
    restart: always
    depends_on:
      - iat3_server
    labels:
      traefik.enable: "true"
      traefik.http.services.iat3-ui.loadbalancer.server.port: "80"
      traefik.http.routers.iat3-ui.rule: Host(`${IAT3_HOST:-localhost}`)
      traefik.http.routers.iat3-ui.entrypoints: web
    networks:
      - iat3

  traefik:
    image: ff8877338069
    container_name: iat3_traefik
    restart: always
    ports:
      - 8080:8080
      - 9090:8090
    environment:
      IAT3_HOST: ${IAT3_HOST:-localhost}
      DJANGO_LOG_VIEWER_HOST: grafana
      DJANGO_LOG_VIEWER_PORT: 3000

      TRAEFIK_ACCESSLOG_FORMAT: json
      TRAEFIK_ACCESSLOG_FIELDS_DEFAULTMODE: drop
      TRAEFIK_ACCESSLOG_FIELDS_NAMES_ClientHost: keep
      TRAEFIK_ACCESSLOG_FIELDS_NAMES_DownstreamContentSize: keep
      TRAEFIK_ACCESSLOG_FIELDS_NAMES_DownstreamStatus: keep
      TRAEFIK_ACCESSLOG_FIELDS_NAMES_Duration: keep
      TRAEFIK_ACCESSLOG_FIELDS_NAMES_RequestHost: keep
      TRAEFIK_ACCESSLOG_FIELDS_NAMES_RequestMethod: keep
      TRAEFIK_ACCESSLOG_FIELDS_NAMES_RequestPath: keep
      TRAEFIK_ACCESSLOG_FIELDS_NAMES_RequestPort: keep
      TRAEFIK_ACCESSLOG_FIELDS_NAMES_RequestProtocol: keep
      TRAEFIK_ACCESSLOG_FIELDS_NAMES_RouterName: keep
      TRAEFIK_ACCESSLOG_FIELDS_NAMES_StartUTC: keep

      TRAEFIK_LOG_FORMAT: json
      TRAEFIK_ENTRYPOINTS_web_ADDRESS: :8080
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: "false"
      TRAEFIK_PROVIDERS_DOCKER_NETWORK: iat3
      TRAEFIK_PROVIDERS_FILE_DIRECTORY: /etc/traefik/rules
    # Uncomment to get Traefik dashboard
    #   TRAEFIK_API_DASHBOARD: "true"
    #   TRAEFIK_ENTRYPOINTS_dashboard_ADDRESS: :8090
    # labels:
    #   traefik.enable: "true"
    #   traefik.http.routers.dashboard.entrypoints: dashboard
    #   traefik.http.routers.dashboard.service: api@internal
    #   traefik.http.routers.dashboard.rule: Host(`${IAT3_HOST:-localhost}`)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./components/analytics/grafana_conf.yml:/etc/traefik/rules/grafana_conf.yml:ro
    networks:
      - iat3
    logging:
      driver: "json-file"
      options:
        max-size: 100m
        max-file: "10"

  iat3_opa:
    container_name: iat3_opa
    image: 593445863d9e
    restart: always
    networks:
      iat3:
        aliases:
          - opa
    command:
      - run
      - --server
      - --log-level=error
      - --set=services.iat3.url=http://iat3-server:8080
      - --set=bundles.iat3.service=iat3
      - --set=bundles.iat3.resource=/api/auth/rules
      - --set=bundles.iat3.polling.min_delay_seconds=5
      - --set=bundles.iat3.polling.max_delay_seconds=15

  iat3_clickhouse:
    container_name: iat3_clickhouse
    image: 769544382e1a
    restart: always
    environment:
      <<: *clickhouse-env
    networks:
      iat3:
        aliases:
          - clickhouse
    volumes:
      - ./components/analytics/clickhouse/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - iat3_events_db:/var/lib/clickhouse/

  iat3_vector:
    container_name: iat3_vector
    image: d8ecc9831523
    restart: always
    depends_on:
      - iat3_clickhouse
    environment:
      <<: *clickhouse-env
    networks:
      iat3:
        aliases:
          - vector
    volumes:
      - ./components/analytics/vector/vector.toml:/etc/vector/vector.toml:ro

  iat3_grafana:
    image: 31656ec60d2e
    restart: always
    container_name: iat3_grafana
    environment:
      <<: *clickhouse-env
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_AUTH_BASIC_ENABLED: false
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: true
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: grafana-clickhouse-datasource
      GF_SERVER_ROOT_URL: http://${IAT3_HOST:-localhost}/analytics
      GF_INSTALL_PLUGINS: https://github.com/grafana/clickhouse-datasource/releases/download/v4.0.8/grafana-clickhouse-datasource-4.0.8.linux_amd64.zip;grafana-clickhouse-datasource
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/all_events.json
    volumes:
      - ./components/analytics/grafana/dashboards/:/var/lib/grafana/dashboards/:ro
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat << 'EOF' > /etc/grafana/provisioning/datasources/ds.yaml
        apiVersion: 1
        datasources:
          - name: 'ClickHouse'
            type: 'grafana-clickhouse-datasource'
            isDefault: true
            jsonData:
              defaultDatabase: $${CLICKHOUSE_DB}
              port: $${CLICKHOUSE_PORT}
              server: $${CLICKHOUSE_HOST}
              username: $${CLICKHOUSE_USER}
              tlsSkipVerify: false
              protocol: http
            secureJsonData:
              password: $${CLICKHOUSE_PASSWORD}
            editable: true
        EOF
        mkdir -p /etc/grafana/provisioning/dashboards
        cat << EOF > /etc/grafana/provisioning/dashboards/dashboard.yaml
        apiVersion: 1
        providers:
          - name: iat3-logs
            type: file
            updateIntervalSeconds: 30
            options:
              path:  /var/lib/grafana/dashboards
              foldersFromFilesStructure: true
        EOF
        exec /run.sh
    networks:
      iat3:
        aliases:
          - grafana

volumes:
  iat3_db:
    driver_opts:
      type: none
      device: /home/dev61/iat3/db
      o: bind
  iat3_data:
    driver_opts:
      type: none
      device: /home/dev61/iat3/data
      o: bind
  iat3_keys:
    driver_opts:
      type: none
      device: /home/dev61/iat3/keys
      o: bind
  iat3_logs:
    driver_opts:
      type: none
      device: /home/dev61/iat3/logs
      o: bind
  iat3_inmem_db:
  iat3_events_db:
    driver_opts:
      type: none
      device: /home/dev61/iat3/events_db
      o: bind
  iat3_cache_db:

networks:
  iat3:
